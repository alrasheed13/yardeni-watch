
name: Yardeni Watch | Refresh and GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yardeni-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh market data
        run: |
          python server.py --refresh-once

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("data/snapshot_cache.json"),
              Path("data/yardeni_feed.json")
          ]

          for path in required:
              if not path.is_file():
                  raise SystemExit(f"Missing: {path}")
              with path.open(encoding="utf-8") as f:
                  payload = json.load(f)
              if not isinstance(payload, dict):
                  raise SystemExit(f"Invalid JSON: {path}")
              print(f"Validated: {path}")
          PY

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site/data
          cp dashboard.html _site/index.html
          cp rs.css rs_module.js _site/
          cp data/*.json _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

